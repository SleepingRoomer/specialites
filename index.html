<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quelle spé est faite pour moi ?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Un jeu de société : chaque famille de spécialités a sa couleur et son pictogramme, les cartes ont un bord franc et une ombre décalée
   comme des pions. Le quiz reste sur une colonne de 720 px ; l'accueil, le podium et le catalogue s'élargissent à 1000 px.
   c1 à c4 servent uniquement à distinguer les spécialités comparées. */
:root {
  --bg: #f3f1fb;
  --surface: #ffffff;
  --ink: #1b1830;
  --muted: #5e5a78;
  --line: #dcd8ec;
  --soft: #ebe8f6;
  --edge: #1b1830;
  --drop: #1b1830;
  --c1: #6a4cf0;
  --c2: #e8336f;
  --c3: #c77700;
  --c4: #0f8f7f;
  --good: #1d8a52;
  --on-accent: #ffffff;
  --cyto: #f6cfe0;
  --nuc: #6b5bb5;
  --nuc-odd: #2c2266;
  --scrim: rgba(20, 16, 40, 0.45);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13111f; --surface: #1d1a2e; --ink: #efedf8; --muted: #aaa5c6; --line: #312d48; --soft: #262239;
    --edge: #4b4570; --drop: #000000;
    --c1: #a48ff7; --c2: #ff7aa6; --c3: #f0b44c; --c4: #4fd1bf; --good: #6fdca0; --on-accent: #13111f;
    --cyto: #4d2638; --nuc: #9d8fe6; --nuc-odd: #e6e0ff; --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13111f; --surface: #1d1a2e; --ink: #efedf8; --muted: #aaa5c6; --line: #312d48; --soft: #262239;
  --edge: #4b4570; --drop: #000000;
  --c1: #a48ff7; --c2: #ff7aa6; --c3: #f0b44c; --c4: #4fd1bf; --good: #6fdca0; --on-accent: #13111f;
  --cyto: #4d2638; --nuc: #9d8fe6; --nuc-odd: #e6e0ff; --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
/* Familles : couleur pleine (--fc) et texte posé dessus (--fi) */
.f-Sprinteurs { --fc: #ff5a47; --fi: #2b0700; }
.f-Artisans { --fc: #ffb21e; --fi: #2d1a00; }
.f-Hybrides { --fc: #17b39b; --fi: #00261f; }
.f-Enqueteurs { --fc: #6a4cf0; --fi: #ffffff; }
.f-Compagnons { --fc: #ff76b4; --fi: #33001a; }
.f-Lecteurs { --fc: #2b74e4; --fi: #ffffff; }
.f-Architectes { --fc: #3fae4a; --fi: #052000; }
/* Jeux de l'accueil */
.g-gouts { --fc: #ff76b4; --fi: #33001a; }
.g-jeux { --fc: #6a4cf0; --fi: #ffffff; }
.g-parcours { --fc: #17b39b; --fi: #00261f; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(circle at 1px 1px, var(--line) 1.2px, transparent 1.3px); background-size: 22px 22px; }
body.locked { overflow: hidden; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.08; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; }
h2 { font-size: clamp(1.5rem, 4.6vw, 2rem); font-weight: 800; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--c1); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }
.kicker { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 1.12rem; color: var(--muted); max-width: 52ch; }
.big { font-family: var(--display); font-size: 1.5rem; font-weight: 800; }
.good { color: var(--good); font-weight: 700; }
svg.ico { width: 1em; height: 1em; display: block; }

/* Barre du haut */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 2px solid var(--edge); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topin { max-width: 1000px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.08rem; text-align: left; }
.brand i { display: grid; grid-template-columns: repeat(2, 8px); gap: 2px; flex: none; }
.brand i b { width: 8px; height: 8px; border-radius: 50%; background: var(--fc); }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 2px solid transparent; padding: 6px 12px; font-size: 0.93rem; font-weight: 600; color: var(--muted); border-radius: 999px; white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-color: var(--edge); background: var(--surface); }

/* Colonne */
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; box-sizing: content-box; }
.wrap.wide { max-width: 1000px; }
.wrap > * { min-width: 0; }
.hero { display: grid; gap: 12px; padding-block: 12px 4px; }
.hero.small { padding-top: 4px; }
.block { display: grid; gap: 14px; }
.center { display: grid; gap: 16px; padding-block: 24px; justify-items: start; }
.foot { font-size: 0.82rem; color: var(--muted); border-top: 2px dashed var(--line); padding-top: 16px; }

/* Pions et cartes */
.pop { background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; box-shadow: 4px 4px 0 var(--drop); transition: transform .15s, box-shadow .15s; }
button.pop:hover, a.pop:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--drop); }
button.pop:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--drop); }

/* Accueil */
.home-hero { display: grid; gap: 16px; padding-top: 10px; }
.tokens { display: flex; flex-wrap: wrap; gap: 10px; }
.tok { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--fc); color: var(--fi); border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); font-size: 22px; }
@media (prefers-reduced-motion: no-preference) {
  .tok { animation: bob 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.45s); }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
}
.gamecards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.gcard { text-align: left; background: var(--fc); color: var(--fi); padding: 20px 18px 18px; display: grid; gap: 8px; align-content: start; position: relative; overflow: hidden; min-height: 250px; }
.gcard:nth-child(1) { transform: rotate(-1.2deg); }
.gcard:nth-child(3) { transform: rotate(1deg); }
.gcard .gpic { width: 64px; height: 64px; border-radius: 16px; background: rgba(255, 255, 255, .28); display: grid; place-items: center; font-size: 40px; margin-bottom: 6px; }
.gcard b { font-family: var(--display); font-weight: 800; font-size: 1.7rem; line-height: 1.05; }
.gcard .gd { font-size: 0.97rem; opacity: .92; }
.pill { justify-self: start; display: inline-block; margin-top: auto; background: var(--surface); color: var(--ink); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 12px; font-size: 0.82rem; font-weight: 700; }
.gcard .pill { margin-top: 8px; }
.gcard .play { position: absolute; right: 14px; bottom: 14px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); color: var(--ink); border: 2px solid var(--edge); display: grid; place-items: center; font-size: 18px; }
.explore { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.etile { text-align: left; padding: 16px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; }
.etile .eico { grid-row: 1 / span 2; display: flex; gap: 3px; }
.etile .eico i { width: 14px; height: 30px; border-radius: 7px; background: var(--fc); border: 2px solid var(--edge); }
.etile b { font-family: var(--display); font-weight: 800; font-size: 1.25rem; }
.etile span.muted { grid-column: 2; font-size: 0.93rem; }
.etile .arrow { grid-row: 1 / span 2; grid-column: 3; }
.resume { text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; }
.resume .rbadge { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--fc); color: var(--fi); border: 2px solid var(--edge); font-size: 24px; }
.resume > span:nth-child(2) { display: grid; gap: 2px; }

/* Listes en lignes */
.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 4px; }
.row:hover .arrow { transform: translateX(3px); color: var(--c1); }
.rowmain { display: grid; gap: 2px; min-width: 0; }
.rowmain b { font-size: 1.05rem; }
.rows.compact .row { padding: 11px 4px; }
.rows.compact .rowmain b { font-size: 1rem; font-weight: 600; }
.meta { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.arrow { color: var(--muted); transition: transform .15s, color .15s; font-weight: 700; }

/* Boutons et contrôles */
.btn { border: 2px solid var(--edge); border-radius: 999px; padding: 11px 22px; font-weight: 700; background: var(--c1); color: var(--on-accent); box-shadow: 3px 3px 0 var(--drop); transition: transform .12s, box-shadow .12s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--drop); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
.btn.ghost { background: var(--surface); color: var(--ink); }
.btn:disabled { opacity: .4; box-shadow: none; }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 0.94rem; font-weight: 600; justify-self: start; }
.link:hover { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.actions.sticky { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.x { border: 2px solid var(--edge); background: var(--surface); width: 28px; height: 28px; border-radius: 50%; line-height: 1; padding: 0; color: var(--ink); flex: none; font-weight: 700; }
.x.big { width: 38px; height: 38px; font-size: 1.2rem; }
.search { width: 100%; padding: 12px 16px; border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); color: var(--ink); font: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; font-size: 0.8rem; font-weight: 600; background: var(--soft); border-radius: 999px; padding: 3px 10px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 0.9rem; font-weight: 600; }
.chip:hover:not(:disabled) { border-color: var(--edge); }
.chip[aria-pressed="true"] { background: var(--fc, var(--ink)); color: var(--fi, var(--bg)); border-color: var(--edge); }
.chip:disabled { opacity: .4; }
.chip.add { border-style: dashed; border-color: var(--edge); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 2px solid var(--edge); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--c1); color: var(--on-accent); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1 1 auto; }
.card { background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 20px; display: grid; gap: 14px; min-width: 0; box-shadow: 4px 4px 0 var(--drop); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.filters .chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.filters .chip svg { font-size: 14px; }
.famgroups { display: grid; gap: 14px; }
.famgroup { display: grid; gap: 6px; }
.famblock { display: grid; gap: 10px; margin-bottom: 26px; }
.famhead { display: flex; align-items: center; gap: 10px; }
.famhead .fdot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--fc); color: var(--fi); border: 2px solid var(--edge); font-size: 16px; }
.famhead h3 { font-size: 1.25rem; }
.famhead p { color: var(--muted); font-size: 0.9rem; }
.empty { color: var(--muted); border: 2px dashed var(--line); border-radius: 14px; padding: 20px; text-align: center; }
.notes { display: grid; gap: 8px; }
.note { font-size: 0.88rem; color: var(--muted); border-left: 3px solid var(--c3); padding-left: 12px; }

/* Quiz */
.quiz { display: grid; gap: 18px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 2px 12px; }
.bar { position: relative; height: 14px; border-radius: 999px; background: var(--surface); border: 2px solid var(--edge); overflow: hidden; }
.bar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--c1) 0 10px, color-mix(in srgb, var(--c1) 80%, #fff) 10px 20px); border-right: 2px solid var(--edge); transition: width .35s ease; }
.qcard { background: var(--surface); border: 2px solid var(--edge); border-radius: 22px; box-shadow: 5px 5px 0 var(--drop); padding: 22px 22px 24px; display: grid; gap: 10px; }
.qtext { font-size: clamp(1.5rem, 5vw, 2.1rem); }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 12px 14px; font-weight: 500; box-shadow: 3px 3px 0 var(--drop); transition: transform .12s, box-shadow .12s, background .12s; }
.opt:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--drop); }
.opts.two .opt, .opt.center { grid-template-columns: 1fr; text-align: center; }
.opt .letter { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1rem; font-weight: 800; background: var(--lc, var(--soft)); color: var(--li, var(--ink)); border: 2px solid var(--edge); }
.opts .opt:nth-child(5n+1) { --lc: #ff76b4; --li: #33001a; }
.opts .opt:nth-child(5n+2) { --lc: #ffb21e; --li: #2d1a00; }
.opts .opt:nth-child(5n+3) { --lc: #17b39b; --li: #00261f; }
.opts .opt:nth-child(5n+4) { --lc: #6a4cf0; --li: #ffffff; }
.opts .opt:nth-child(5n+5) { --lc: #2b74e4; --li: #ffffff; }
.opt[aria-pressed="true"] { background: var(--lc, var(--c1)); color: var(--li, var(--on-accent)); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--drop); }
.opt[aria-pressed="true"] .letter { background: var(--surface); color: var(--ink); }

/* Jeux */
.gamegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.gmini { padding: 16px; display: grid; gap: 6px; align-content: start; }
.gmini .gpic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--fc); color: var(--fi); border: 2px solid var(--edge); font-size: 28px; }
.gmini b { font-family: var(--display); font-size: 1.2rem; font-weight: 800; }
.gmini span:last-child { color: var(--muted); font-size: 0.92rem; }
.gtitle { display: flex; align-items: center; gap: 14px; }
.gtitle .gpic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--fc); color: var(--fi); border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); font-size: 32px; flex: none; }
.game { gap: 16px; }
.gdots { display: flex; gap: 6px; }
.gdots i { width: 28px; height: 10px; border-radius: 6px; background: var(--surface); border: 2px solid var(--edge); }
.gdots i.done { background: var(--good); }
.gdots i.on { background: var(--c1); }
.steps { display: grid; gap: 10px; padding-left: 20px; }
.steps li { display: grid; gap: 1px; }
.gfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.clues { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.clue { min-height: 110px; display: grid; gap: 6px; align-content: start; text-align: left; background: repeating-linear-gradient(45deg, var(--soft) 0 8px, var(--surface) 8px 16px); border: 2px dashed var(--edge); border-radius: 14px; padding: 12px; font-size: 0.92rem; }
button.clue:hover { border-style: solid; transform: rotate(-1deg); }
.clue.open { background: #fff4c7; color: #2d1a00; border-style: solid; box-shadow: 3px 3px 0 var(--drop); }
.clue.open .kicker { color: #6b5200; }
.basket { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.basket b { font-family: var(--display); font-size: 1.6rem; font-weight: 800; }
.choice2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.bigchoice { display: grid; gap: 4px; justify-items: start; text-align: left; background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 18px; box-shadow: 4px 4px 0 var(--drop); transition: transform .12s, box-shadow .12s; }
.bigchoice:first-child { background: #ffe1d6; color: #2b0700; }
.bigchoice:last-child { background: #d6f5e3; color: #052000; }
.bigchoice .kicker, .bigchoice .muted { color: inherit; opacity: .75; }
.bigchoice:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--drop); }
.bigchoice b { font-family: var(--display); font-size: 2.8rem; font-weight: 800; line-height: 1.05; }
.arena { position: relative; height: 300px; background: radial-gradient(circle at 50% 50%, var(--surface), var(--soft)); border: 2px solid var(--edge); border-radius: 18px; overflow: hidden; touch-action: manipulation; }
.target { position: absolute; border: 2px solid var(--edge); padding: 0; border-radius: 50%; background: radial-gradient(circle, #fff 0 18%, var(--c2) 19% 38%, #fff 39% 56%, var(--c2) 57%); }
.seq { font-family: var(--display); font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: 0.02em; background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 10px 18px; justify-self: start; box-shadow: 3px 3px 0 var(--drop); }
.slide { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; padding: 16px; background: var(--soft); border: 2px solid var(--edge); border-radius: 50% / 18%; max-width: 460px; }
.cell { aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; background: var(--cyto); position: relative; }
.cell::after { content: ""; position: absolute; width: var(--s); height: var(--s); left: var(--x); top: var(--y); transform: translate(-50%, -50%); border-radius: 50%; background: var(--nuc); }
.cell.odd::after { background: var(--nuc-odd); border-radius: 46% 54% 40% 60% / 55% 42% 58% 45%; }
.cell:hover { box-shadow: 0 0 0 3px var(--c1); }
.jars { display: grid; gap: 12px; }
.jar { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 14px; box-shadow: 3px 3px 0 var(--drop); }
.stepper { display: inline-flex; align-items: center; gap: 10px; }

/* ===== Calcul ===== */
function profileFrom(questions, answers) {
  return DIMS.map(d => {
    let num = 0, den = 0;
    questions.forEach((q, i) => {
      if (answers[i] == null) return;
      const max = Math.max(...q.o.map(o => Math.abs(o.eff[d.c] || 0)));
      if (!max) return;
      den += q.w * max;
      num += q.w * (q.o[answers[i]].eff[d.c] || 0);
    });
    return den ? 2 * num / den : 0;
  });
}
function distance(S, P) {
  let num = 0, den = 0;
  P.forEach((v, k) => { const w = 1 + Math.abs(v) / 2; num += w * (S[k] - v) ** 2; den += w; });
  return Math.sqrt(num / den);
}
/* Affinité = moitié distance (sur un profil étiré pour ne pas favoriser les spécialités « moyennes »),
   moitié ressemblance de forme (cosinus). Testé : chaque profil de spécialité retrouve sa spécialité en tête. */
function cosine(a, b) { let x = 0, y = 0, z = 0; a.forEach((v, i) => { x += v * b[i]; y += v * v; z += b[i] * b[i]; }); return y && z ? x / Math.sqrt(y * z) : 0; }
function stretch(S) { const m = Math.max(...S.map(Math.abs)); return m > 0.25 ? S.map(v => v * 2 / m) : S; }
const affinity = (S, P) => 0.5 * (100 * (1 - distance(stretch(S), P) / 4)) + 0.5 * (50 * (1 + cosine(S, P)));
const pole = (d, v) => v < 0 ? d.neg : d.pos;
function poleWord(d, v) {
  if (v <= -1.25) return "très " + d.neg.toLowerCase();
  if (v <= -0.5) return "plutôt " + d.neg.toLowerCase();
  if (v >= 1.25) return "très " + d.pos.toLowerCase();
  if (v >= 0.5) return "plutôt " + d.pos.toLowerCase();
  return "entre les deux";
}
function sharedPoles(S, P) {
  return DIMS.map((d, k) => ({ d, k, gap: Math.abs(S[k] - P[k]), w: Math.abs(P[k]) }))
    .filter(x => x.w >= 1 && Math.sign(S[x.k]) === Math.sign(P[x.k]) && Math.abs(S[x.k]) >= 0.5 && x.gap <= 1)
    .sort((a, b) => a.gap - b.gap).slice(0, 2).map(x => pole(x.d, P[x.k]));
}
function rank(profile, adjust) {
  return SPECS.map(s => {
    const it = { s, score: affinity(profile, s.p), reasons: [] };
    const sh = sharedPoles(profile, s.p);
    if (sh.length) it.reasons.push("En commun : " + sh.join(" · "));
    if (adjust) adjust(it);
    it.score = Math.max(0, Math.min(100, it.score));
    return it;
  }).sort((a, b) => b.score - a.score);
}
function familyOf(items) {
  const top = items.slice(0, 5), counts = {};
  top.forEach(t => { counts[t.s.f] = (counts[t.s.f] || 0) + 1; });
  const best = Math.max(...Object.values(counts));
  return counts[top[0].s.f] === best ? top[0].s.f : Object.keys(counts).find(k => counts[k] === best);
}

function save() {
  try { localStorage.setItem("atlas-v2", JSON.stringify({ last: S.last, compare: S.compare })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem("atlas-v2") || "null");
    if (d && d.last && d.last.profile) S.last = d.last;
    if (d && Array.isArray(d.compare) && d.compare.every(byKey)) S.compare = d.compare;
  } catch (e) {}
}
function storeResult(source, profile, ranked, strategy = [], notes = []) {
  S.last = { source, profile, strategy, notes, ranked: ranked.map(r => ({ k: r.s.k, score: r.score, reasons: r.reasons })) };
  save();
  go("results");
}

let TIMER = null, LATER = null;
function stopTimers() { if (TIMER) clearInterval(TIMER); if (LATER) clearTimeout(LATER); TIMER = LATER = null; }
function go(screen) {
  stopTimers();
  S.screen = screen;
  render();
  window.scrollTo({ top: 0 });
}
function render() {
  $("#view").innerHTML = (VIEWS[S.screen] || VIEWS.home)();
  $("#view").className = "wrap" + (["home", "results", "catalog"].includes(S.screen) ? " wide" : "");

    const on = b.dataset.act === S.screen || (b.dataset.act === "home" && ["home", "quiz", "goutsMid", "games", "parcours", "results"].includes(S.screen));
    b.setAttribute("aria-current", on ? "page" : "false");

}

    go("quiz");
  } else if (kind === "jeux") {
    S.game = { i: -1, d: {} };
    go("games");
  } else if (kind === "parcours") {
    S.par = { step: "stages", stages: {}, years: null, gardes: null, q: "" };

function answer(k) {
  const Q = S.quiz;
  if (Q.locked) return;
  Q.locked = true;
  Q.answers[Q.idx] = k;
  document.querySelectorAll(".opt").forEach((b, i) => b.setAttribute("aria-pressed", i === k));
  LATER = setTimeout(() => {
    Q.locked = false;
    if (Q.idx + 1 < Q.qs.length) { Q.idx++; render(); }
    else if (Q.kind === "gouts" && !Q.refined) go("goutsMid");
    else if (Q.kind === "gouts") finishGouts();
    else finishParcours();
  }, reduceMotion() ? 0 : 240);
}
function quizBack() {
  const Q = S.quiz;
  if (Q.idx > 0) { Q.idx--; render(); return; }
  if (Q.kind === "moments") { S.par.step = "cons"; go("parcours"); } else go("home");
}

const RATINGS = [["love", "Adoré"], ["meh", "Mitigé"], ["no", "Pas pour moi"]];
function stageChips(q) {
  const P = S.par, needle = q.trim().toLowerCase();
  return Object.entries(FAMILIES).map(([fk, f]) => {
    const list = SPECS.filter(s => s.f === fk && !P.stages[s.k] && (!needle || s.n.toLowerCase().includes(needle) || s.s.toLowerCase().includes(needle)));

}

  const ok = P.years && P.gardes;
  return `<section class="block">

    <p class="kicker">Mon parcours · Tes limites</p>

      <p><b>Combien d’années d’internat acceptes-tu&nbsp;?</b></p>
      <div class="seg wide" role="group">${[[4, "4 ans au plus"], [5, "5 ans au plus"], [99, "Peu importe"]].map(([v, l]) => `<button data-act="pYears" data-arg="${v}" aria-pressed="${P.years === v}">${l}</button>`).join("")}</div>
      <p class="muted small">Selon le guide de l’ISNI, les DES durent 4, 5 ou 6 ans.</p>
    </div>
    <div class="card">
      <p><b>Les gardes, sur toute une carrière :</b></p>
      <div class="seg wide" role="group">${[["love", "J’aime ça"], ["dep", "Ça dépend"], ["no", "Je préfère m’en passer"]].map(([v, l]) => `<button data-act="pGardes" data-arg="${v}" aria-pressed="${P.gardes === v}">${l}</button>`).join("")}</div>
    </div>
    <div class="actions"><button class="btn" data-act="pMoments" ${ok ? "" : "disabled"}>Continuer</button></div>
  </section>`;
}
function finishParcours() {
  const P = S.par, profile = profileFrom(MOMENTS, S.quiz.answers);
  let excluded = 0;
  SPECS.forEach(s => { if (s.d > P.years) excluded++; });
  const ranked = rank(profile, it => {
    const s = it.s, r = P.stages[s.k];
    if (r === "love") { it.score += 12; it.reasons.unshift("Stage adoré"); }
    if (r === "meh") { it.score -= 3; it.reasons.unshift("Stage mitigé"); }
    if (r === "no") { it.score -= 20; it.reasons.unshift("Stage pas pour toi"); }
    let near = null;
    Object.entries(P.stages).forEach(([k, v]) => {
      const o = byKey(k);
      if (k === s.k || o.f !== s.f) return;
      if (v === "love") { it.score += 4; near = near || o.s; }
      if (v === "no") it.score -= 4;
    });
    if (near && !r) it.reasons.push("Même famille que " + near);
    if (s.d > P.years) { it.score -= 30; it.reasons.push(`${s.d} ans : au-delà de ta limite`); }
    if (P.gardes === "no" && s.p[0] <= -1) { it.score -= 8; it.reasons.push("Rythme de gardes probable"); }
    if (P.gardes === "love" && s.p[0] <= -1) { it.score += 5; it.reasons.push("Rythme intense, comme tu aimes"); }
  });
  const notes = [];
  if (excluded) notes.push(`${plural(excluded, "spécialité")} ${excluded > 1 ? "dépassent" : "dépasse"} ta limite de ${P.years} ans d’internat : elles passent en bas du classement.`);
  if (P.gardes !== "dep") notes.push("L’effet des gardes repose sur notre estimation du rythme de chaque spécialité, pas sur le guide.");
  storeResult("parcours", profile, ranked, [], notes);
}

        const h = (i * 37 + 11) % 17, sz = 30 + (h % 9), x = 44 + (h % 5) - 2, y = 46 + ((h * 3) % 7) - 3;

    if (d.step === "alloc") {

/* Épreuve d’adresse : animée hors rendu */
function afterGameRender() {
  const G = S.game;
  if (G.i < 0 || GAMES[G.i].k !== "atelier") return;
  const d = gd("atelier");
  if (d.step !== "a" && d.step !== "bonusA") return;
  if (TIMER) return;
  const end = Date.now() + 15000;
  d.size = 60; d.runHits = 0;
  placeTarget();
  TIMER = setInterval(() => {
    const left = Math.max(0, end - Date.now());
    const c = $("#clock");
    if (c) c.textContent = (left / 1000).toFixed(1).replace(".", ",") + " s";
    if (!left) {
      stopTimers();
      if (d.step === "a") { d.hits = d.runHits; d.step = "introB"; }
      else { d.bonusHits = d.runHits; d.step = "end"; }
      render();
    }
  }, 100);
}
function placeTarget() {
  const d = gd("atelier"), arena = $("#arena"), t = $("#target");
  if (!arena || !t) return;
  const w = arena.clientWidth, h = arena.clientHeight, s = d.size;
  t.style.width = t.style.height = s + "px";
  t.style.left = Math.round(Math.random() * Math.max(0, w - s)) + "px";
  t.style.top = Math.round(Math.random() * Math.max(0, h - s)) + "px";
}

function finishGames() {
  const D = S.game.d, acc = {};
  const add = (eff, w = 1) => Object.entries(eff).forEach(([c, v]) => { (acc[c] = acc[c] || []).push([v, w]); });
  const strat = [];
  const e = D.enq, v = D.verger, a = D.atelier, l = D.lame, b = D.budget;

  const n = e.rev.length;
  add({ TEM: clamp((n - 3.5) / 1.25), INC: ENQ.next[e.r2][1] });
  let read = n <= 2 ? "Tu tranches tôt, à l’intuition." : n >= 5 ? "Tu veux tout voir avant de conclure." : "Tu attends d’avoir une piste solide, sans tout retourner.";
  if (e.obj === 1 && n <= 2) read = "Tu voulais ne pas te tromper, mais tu as tranché tôt : tu te fies plus à ton intuition que tu ne le penses.";
  if (e.obj === 0 && n >= 5) read = "Tu voulais aller vite, mais tu as tout retourné : le besoin de certitude a gagné.";
  strat.push({ g: "L’enquête", obj: ENQ.obj[e.obj], fact: `${n} indice${n > 1 ? "s" : ""} sur 6 avant d’accuser, ${e.acc === ENQ.culprit ? "bonne réponse" : "mauvaise piste"}.`, read });

  const waits = v.picks.filter(p => p === "wait").length;
  add({ ARC: (waits - 3) * 2 / 3 });
  strat.push({ g: "Le verger", obj: VERGER.obj[v.obj], fact: `${waits} fois sur 6, tu as laissé mûrir.`,
    read: waits >= 4 ? "Tu sais attendre une récompense plus grande." : waits <= 2 ? "Tu préfères un résultat tout de suite." : "Tu alternes selon ce qui est proposé." });

  const ch = { a: -2, b: 2, none: 0 }[a.choice];
  add({ OUT: ch });
  strat.push({ g: "L’atelier", obj: null, fact: `Pour le tour bonus, tu as choisi ${{ a: "l’adresse", b: "la logique", none: "de passer" }[a.choice]}.`,
    read: a.choice === "a" ? "Le geste t’attire plus que la réflexion." : a.choice === "b" ? "La réflexion t’attire plus que le geste." : "Ni l’un ni l’autre ne t’a retenu." });

  add(MISSIONS[l.mission].eff);
  strat.push({ g: "La lame", obj: null, fact: `Anomalie trouvée en ${l.secs} s, puis : « ${MISSIONS[l.mission].t} ».`, read: "" });

  const [lea, dep, log] = b.tk;
  add({ ECH: clamp((dep + 0.5 * log - lea) / 5), EMO: clamp((3.3 - lea) / 3.3 * 1.5) });
  add(BUDGET.announce[b.ann].eff);
  strat.push({ g: "Le budget", obj: BUDGET.obj[b.obj], fact: `${lea} jeton${lea > 1 ? "s" : ""} pour Léa, ${dep} pour le dépistage, ${log} pour le logiciel ; annonce : ${BUDGET.announce[b.ann].t.toLowerCase()}.`,
    read: lea >= 5 ? "Le visage d’une personne pèse lourd dans tes choix." : dep >= 5 ? "Tu raisonnes à l’échelle du groupe." : "Tu cherches l’équilibre entre les besoins." });

  const profile = DIMS.map(d => {
    const list = acc[d.c];
    if (!list) return 0;
    const sw = list.reduce((s, [, w]) => s + w, 0);
    return clamp(list.reduce((s, [x, w]) => s + x * w, 0) / sw);
  });
  storeResult("jeux", profile, rank(profile), strat, ["Les jeux mesurent chaque dimension à partir d’un ou deux comportements : le résultat est plus contrasté que celui des questions."]);
}

/* ===== Fiche spécialité ===== */
function openSheet(k) { S.sheet = { k, tab: "metier" }; renderSheet(); }
function closeSheet() { S.sheet = null; $("#sheet").hidden = true; document.body.classList.remove("locked"); if (S.sheetFrom) S.sheetFrom.focus(); }
function renderSheet() {
  const sh = S.sheet, s = byKey(sh.k), you = S.last && S.last.profile;
  const tabs = [["metier", "Le métier"], ["formation", "La formation"]].concat(you ? [["toi", "Toi et elle"]] : []);
  let body = "";
  if (sh.tab === "metier") body = `<dl class="facts">
      <dt>Au quotidien</dt><dd>${esc(s.quot)}</dd>
      <dt>Ce qui rend heureux</dt><dd>${esc(s.heur)}</dd>
      <dt>L’envers du décor</dt><dd>${esc(s.envers)}</dd>
      <dt>Idée reçue</dt><dd>${esc(s.idee)}</dd></dl>`;
  if (sh.tab === "formation") body = `
      <div class="kv"><span>Durée</span><b>${s.d} ans</b></div>
      ${s.co ? `<div class="kv"><span>Co-DES avec</span><b>${esc(s.co)}</b></div>` : ""}
      <div class="kv col"><span>Options</span>${chips(s.opt)}</div>
      <div class="kv col"><span>Formations spécialisées transversales</span>${chips(s.fst)}</div>
      <div class="kv col"><span>Selon le guide de l’ISNI</span><ul class="guide">${s.g.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <p class="muted small">Source : Guide Futur Interne ISNI 2025-2026, résumé et reformulé.</p>`;
  if (sh.tab === "toi") body = `<div class="legend"><span><i class="dot"></i>Toi</span><span><i class="dot ring"></i>${esc(s.s)}</span>
      <span class="muted">${Math.round(affinity(you, s.p))} % d’affinité</span></div>${dimsYou(you, s)}`;
  const inCmp = S.compare.includes(s.k);
  $("#sheet-panel").innerHTML = `
    <div class="sheethead f-${s.f}"><span class="sg" aria-hidden="true">${GLYPH[s.f]}</span>
      <div><p class="kicker">${esc(FAMILIES[s.f].n)} · ${s.d} ans</p><h2 id="sheet-title">${esc(s.n)}</h2><p class="nick">${esc(s.nick)}</p></div>
      <button class="x big" data-act="closeSheet" aria-label="Fermer">×</button>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([v, l]) => `<button role="tab" data-act="sheetTab" data-arg="${v}" aria-selected="${sh.tab === v}">${l}</button>`).join("")}</div>
    <div class="sheetbody">${body}</div>
    <div class="actions"><button class="btn ${inCmp ? "ghost" : ""}" data-act="sheetCmp" data-arg="${s.k}">${inCmp ? "Ouvrir le comparateur" : "Ajouter au comparateur"}</button></div>`;
  const el = $("#sheet");
  if (el.hidden) { el.hidden = false; document.body.classList.add("locked"); S.sheetFrom = document.activeElement; $("#sheet-panel").focus(); }
}

/* ===== Catalogue ===== */
function catalogRows() {
  const q = ($("#c-search") ? $("#c-search").value : "").trim().toLowerCase();
  return Object.entries(FAMILIES).filter(([fk]) => S.catFam === "all" || S.catFam === fk).map(([fk, f]) => {
    const list = SPECS.filter(s => s.f === fk && (!q || s.n.toLowerCase().includes(q) || s.s.toLowerCase().includes(q) || s.nick.toLowerCase().includes(q)))
      .sort((a, b) => a.s.localeCompare(b.s, "fr"));
    if (!list.length) return "";
    return `<div class="famblock f-${fk}"><div class="famhead"><span class="fdot" aria-hidden="true">${GLYPH[fk]}</span><div><h3>${esc(f.n)}</h3><p>${esc(f.d)}</p></div></div>
      <div class="tiles">${list.map(s => `<button class="tile pop f-${fk}" data-act="open" data-arg="${s.k}"><span class="tg" aria-hidden="true">${GLYPH[fk]}</span><b>${esc(s.s)}</b><span class="nick">${esc(s.nick)}</span><span class="dur num">${s.d} ans</span></button>`).join("")}</div></div>`;
  }).join("") || `<p class="empty">Aucune spécialité ne correspond.</p>`;
}
function viewCatalog() {
  return `<section class="hero small"><p class="kicker">Explorer</p><h1>Les 44 spécialités</h1>
    <p class="lead">Sept familles, une couleur chacune. Touche une spécialité pour ouvrir sa fiche : le métier, la formation, et ta proximité si tu as joué.</p></section>
  <input class="search" id="c-search" data-input="catSearch" type="search" placeholder="Rechercher une spécialité" autocomplete="off" aria-label="Rechercher une spécialité">
  <div class="filters" role="group" aria-label="Filtrer par famille">${[["all", "Toutes"]].concat(Object.entries(FAMILIES).map(([k, f]) => [k, f.n.replace("Les ", "")])).map(([k, l]) => `<button class="chip ${k === "all" ? "" : "f-" + k}" data-act="catFam" data-arg="${k}" aria-pressed="${S.catFam === k}">${k === "all" ? "" : GLYPH[k]}${esc(l)}</button>`).join("")}</div>
  <div id="c-list">${catalogRows()}</div>`;
}


/* ===== Comparateur ===== */
const CMP_TABS = [["quot", "Au quotidien"], ["heur", "Ce qui rend heureux"], ["envers", "L’envers"], ["idee", "Idée reçue"], ["g", "Selon le guide"]];
function pickerList() {
  const q = ($("#k-search") ? $("#k-search").value : "").trim().toLowerCase();
  const full = S.compare.length >= 4;
  return Object.entries(FAMILIES).map(([fk, f]) => {
    const list = SPECS.filter(s => s.f === fk && (!q || s.n.toLowerCase().includes(q) || s.s.toLowerCase().includes(q)));
    if (!list.length) return "";
    return `<div class="famgroup"><span class="kicker">${esc(f.n)}</span><div class="chips">${list.map(s => {
      const on = S.compare.includes(s.k);
      return `<button class="chip f-${s.f}" data-act="cmpToggle" data-arg="${s.k}" aria-pressed="${on}" ${!on && full ? "disabled" : ""}>${esc(s.s)}</button>`;
    }).join("")}</div></div>`;
  }).join("");
}
function lanes(specs, k, you) {
  return `<div class="lanes" role="img" aria-label="${esc(DIMS[k].n)} : ${specs.map(s => esc(s.s) + " " + esc(poleWord(DIMS[k], s.p[k]))).join(", ")}${you ? ", toi " + esc(poleWord(DIMS[k], you[k])) : ""}">
    <span class="poles"><span>${esc(DIMS[k].neg)}</span><span>${esc(DIMS[k].pos)}</span></span>
    ${specs.map((s, i) => `<span class="lane"><span class="dot" style="left:${pct(s.p[k])};background:${COLORS[i]}"></span></span>`).join("")}
    ${you ? `<span class="you" style="left:${pct(you[k])}"></span>` : ""}
  </div>`;
}
function viewCompare() {
  const specs = S.compare.map(byKey), you = S.last && S.last.profile;
  const head = `<section class="hero small"><p class="kicker">Comparer</p><h1>Tu hésites&nbsp;?</h1>
    <p class="lead">Choisis de 2 à 4 spécialités : on montre d’abord ce qui les sépare, le détail se déplie à la demande.</p></section>
  <div class="picked">${specs.map((s, i) => `<span class="pchip" style="--c:${COLORS[i]}"><i class="dot" style="background:${COLORS[i]}"></i>${esc(s.s)}<button class="x" data-act="cmpToggle" data-arg="${s.k}" aria-label="Retirer ${esc(s.s)}">×</button></span>`).join("")}
    ${specs.length < 4 ? `<button class="chip add" data-act="cmpPicker" aria-expanded="${S.cmpPicker}">+ Ajouter</button>` : ""}</div>
  ${S.cmpPicker ? `<div class="card picker"><input class="search" id="k-search" data-input="cmpSearch" type="search" placeholder="Rechercher" autocomplete="off" aria-label="Rechercher une spécialité"><div id="k-list" class="famgroups">${pickerList()}</div>
    <button class="link" data-act="cmpPicker">Fermer la liste</button></div>` : ""}`;
  if (specs.length < 2) return head + `<p class="empty">Ajoute au moins une autre spécialité pour comparer.</p>`;

  const stats = DIMS.map((d, k) => { const v = specs.map(s => s.p[k]); return { d, k, spread: Math.max(...v) - Math.min(...v) }; }).sort((a, b) => b.spread - a.spread);
  const shown = S.cmpAll ? stats : stats.slice(0, 3);
  const common = stats.filter(x => x.spread <= 1).map(x => x.d.n.toLowerCase());
  let lean = "";
  if (you) {
    const r = specs.map((s, i) => ({ s, i, a: affinity(you, s.p) })).sort((a, b) => b.a - a.a);
    lean = `<p>Ton profil (${esc(SOURCE_LABEL[S.last.source])}) penche vers <b style="color:${COLORS[r[0].i]}">${esc(r[0].s.s)}</b> : ${r.map(x => `${esc(x.s.s)} ${Math.round(x.a)} %`).join(" · ")}.</p>`;
  }
  const facts = [
    ["Famille", s => FAMILIES[s.f].n.replace("Les ", "")],
    ["Durée", s => s.d + " ans"],
    ["Co-DES", s => s.co || "—"],
    ["Options", s => s.opt.length ? s.opt.join(", ") : "—"]
  ];
  const tab = S.cmpTab;
  return head + `
  <section class="card">
    <h3>En un coup d’œil</h3>
    <div class="scrollx"><table class="glance"><thead><tr><th></th>${specs.map((s, i) => `<th style="color:${COLORS[i]}">${esc(s.s)}</th>`).join("")}</tr></thead>
      <tbody>${facts.map(([l, f]) => `<tr><th scope="row">${l}</th>${specs.map(s => `<td>${esc(f(s))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  </section>
  <section class="card">
    <h3>Ce qui les sépare</h3>
    ${lean}
    <div class="legend">${specs.map((s, i) => `<span><i class="dot" style="background:${COLORS[i]}"></i>${esc(s.s)}</span>`).join("")}${you ? `<span><i class="youkey"></i>Toi</span>` : ""}</div>
    <div class="dimlist">${shown.map(x => `<div class="cdim"><b>${esc(x.d.n)}</b>${lanes(specs, x.k, you)}</div>`).join("")}</div>
    ${common.length && !S.cmpAll ? `<p class="muted small">Proches sur : ${esc(common.join(", "))}.</p>` : ""}
    <button class="link" data-act="cmpAll">${S.cmpAll ? "Ne montrer que l’essentiel" : "Voir les 8 dimensions"}</button>
  </section>
  <section class="card">
    <h3>Le métier côte à côte</h3>
    <div class="tabs scroll" role="tablist">${CMP_TABS.map(([v, l]) => `<button role="tab" data-act="cmpTab" data-arg="${v}" aria-selected="${tab === v}">${l}</button>`).join("")}</div>
    <div class="cols n${specs.length}">${specs.map((s, i) => `<div class="colitem"><b style="color:${COLORS[i]}">${esc(s.s)}</b>${tab === "g" ? `<ul class="guide">${s.g.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p>${esc(s[tab])}</p>`}</div>`).join("")}</div>
  </section>`;
}

/* ===== Actions ===== */
const ACT = {
  home: () => go("home"), catalog: () => go("catalog"), compare: () => go("compare"), results: () => go(S.last ? "results" : "home"),
  start: k => startQuiz(k),
  ans: k => answer(Number(k)),
  quizBack,
  refine: () => { const Q = S.quiz; Q.refined = true; Q.qs = TASTE.slice(); Q.idx = 24; go("quiz"); },
  goutsDone: () => finishGouts(),
  open: k => openSheet(k),
  closeSheet,
  sheetTab: t => { S.sheet.tab = t; renderSheet(); },
  sheetCmp: k => { if (!S.compare.includes(k)) S.compare = S.compare.length >= 4 ? [...S.compare.slice(1), k] : [...S.compare, k]; save(); closeSheet(); go("compare"); },
  cmpTop: () => { S.compare = S.last.ranked.slice(0, 3).map(r => r.k); save(); go("compare"); },
  cmpToggle: k => {
    const q = $("#k-search") ? $("#k-search").value : "";
    S.compare = S.compare.includes(k) ? S.compare.filter(x => x !== k) : S.compare.length < 4 ? [...S.compare, k] : S.compare;
    save(); render();
    if (q && $("#k-search")) { $("#k-search").value = q; $("#k-list").innerHTML = pickerList(); }
  },
  cmpPicker: () => { S.cmpPicker = !S.cmpPicker; render(); if (S.cmpPicker) $("#k-search").focus(); },
  cmpAll: () => { S.cmpAll = !S.cmpAll; render(); },
  cmpTab: t => { S.cmpTab = t; render(); },
  catFam: k => { const q = $("#c-search").value; S.catFam = k; render(); $("#c-search").value = q; $("#c-list").innerHTML = catalogRows(); },
  /* parcours */
  pAdd: k => { S.par.stages[k] = "meh"; S.par.q = ""; render(); },
  pRm: k => { delete S.par.stages[k]; render(); },
  pRate: arg => { const [k, v] = arg.split("|"); S.par.stages[k] = v; render(); },
  pNext: () => { S.par.step = "cons"; go("parcours"); },
  pBack: () => { S.par.step = "stages"; go("parcours"); },
  pYears: v => { S.par.years = Number(v); render(); },
  pGardes: v => { S.par.gardes = v; render(); },
  pMoments: () => { S.quiz = { kind: "moments", qs: MOMENTS, answers: [], idx: 0 }; go("quiz"); },
  /* jeux */
  gStart: () => { S.game.i = 0; render(); },
  gNext: () => nextGame(),
  gObj: arg => {
    const [k, i] = arg.split("|"), d = gd(k);
    d.obj = Number(i);
    if (k === "enq") { d.step = "play"; d.rev = []; d.t0 = Date.now(); }
    if (k === "verger") { d.step = "play"; d.r = 0; d.picks = []; }
    if (k === "budget") { d.step = "alloc"; d.tk = [0, 0, 0]; }
    render();
  },
  enqClue: i => { const d = gd("enq"); if (!d.rev.includes(+i)) d.rev.push(+i); render(); },
  enqOpen: () => { gd("enq").accusing = true; render(); },
  enqCancel: () => { gd("enq").accusing = false; render(); },
  enqAccuse: i => { const d = gd("enq"); d.acc = +i; d.secs = Math.round((Date.now() - d.t0) / 1000); d.step = "verdict"; render(); },
  enqNext: () => { gd("enq").step = "r2"; render(); },
  enqR2: i => { gd("enq").r2 = +i; nextGame(); },
  vPick: p => { const d = gd("verger"); d.picks.push(p); d.r++; if (d.r >= VERGER.rounds.length) d.step = "end"; render(); },
  aStart: w => { const d = gd("atelier"); if (w === "a") d.step = "a"; else { d.step = "b"; d.qi = 0; d.good = 0; d.fb = null; } stopTimers(); render(); },
  aHit: () => { const d = gd("atelier"); d.runHits++; d.size = Math.max(22, d.size - 3); const h = $("#hits"); if (h) h.textContent = d.runHits; placeTarget(); },
  aSeq: o => {
    const d = gd("atelier"), set = d.step === "b" ? SEQ_A : SEQ_B, q = set[d.qi], ok = o === q.a;
    if (d.step === "b" && ok) d.good++;
    d.fb = { ok };
    render();
    LATER = setTimeout(() => {
      d.fb = null; d.qi++;
      if (d.qi >= 3) d.step = d.step === "b" ? "choice" : "end";
      render();
    }, reduceMotion() ? 300 : 800);
  },
  aChoice: c => { const d = gd("atelier"); d.choice = c; if (c === "a") d.step = "bonusA"; else if (c === "b") { d.step = "bonusB"; d.qi = 0; d.fb = null; } else d.step = "end"; render(); },
  lCell: i => { const d = gd("lame"); if (+i === d.odd) { d.secs = Math.max(1, Math.round((Date.now() - d.t0) / 1000)); d.step = "found"; } else d.miss++; render(); },
  lNext: () => { gd("lame").step = "mission"; render(); },
  lMission: i => { gd("lame").mission = +i; nextGame(); },
  bPlus: i => { const d = gd("budget"); if (d.tk.reduce((a, b) => a + b, 0) < 10) d.tk[+i]++; render(); },
  bMinus: i => { const d = gd("budget"); if (d.tk[+i]) d.tk[+i]--; render(); },
  bDone: () => { gd("budget").step = "announce"; render(); },
  bAnnounce: i => { gd("budget").ann = +i; nextGame(); }
};
const INPUT = {
  pSearch: v => { S.par.q = v; $("#p-chips").innerHTML = stageChips(v); },
  catSearch: () => { $("#c-list").innerHTML = catalogRows(); },
  cmpSearch: () => { $("#k-list").innerHTML = pickerList(); }
};
const VIEWS = { home: viewHome, quiz: viewQuiz, goutsMid: viewGoutsMid, parcours: viewParcours, games: viewGames, results: viewResults, catalog: viewCatalog, compare: viewCompare };

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && !b.disabled && ACT[b.dataset.act]) { ACT[b.dataset.act](b.dataset.arg, b); return; }
  if (e.target.id === "sheet") closeSheet();
});
document.addEventListener("input", e => { const f = e.target.dataset && e.target.dataset.input; if (f && INPUT[f]) INPUT[f](e.target.value); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });

load();
render();

</script>

</body></html>
